[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annovert"
version = "0.1.0"
description = "Convert between digital pathology annotation formats (ASAP XML, GeoJSON, 3D Histech, QuPath MRXS, Binary Masks)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Basic tooling team, Computational pathology group", email = "" },
]

keywords = [
    "digital pathology",
    "annotation",
    "format conversion",
    "ASAP",
    "GeoJSON",
    "QuPath",
    "3D Histech",
    "MRXS",
    "binary mask",
    "segmentation",
    "pathology",
    "medical imaging",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0",
    "pillow>=9.0",
    "tqdm>=4.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "numpy>=1.21",
    "openslide-python>=4.0",
    "openslide-bin>=4.0",
]

[project.optional-dependencies]
ndpa = [
    "tifffile>=2022.0",
]

app = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[project.urls]
Homepage = "https://github.com/computationalpathologygroup/annovert"
Repository = "https://github.com/computationalpathologygroup/annovert"
"Bug Tracker" = "https://github.com/computationalpathologygroup/annovert/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["annovert*"]
